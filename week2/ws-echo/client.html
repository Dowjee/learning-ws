<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>D1 WebSocket Echo 测试</title>
</head>
<body>
    <h3>WebSocket Echo 测试</h3>
    <input id="msg" value="hello from browser">
    <button onclick="send()">发送</button>
    <div id="log"></div>

    <script>
        // 把这里换成你虚拟机的真实 IP，用 ip addr 或 ifconfig 查
        const ws = new WebSocket("ws://192.168.1.16:8765");

        function log(text) {
            document.getElementById("log").innerHTML += text + "<br>";
            console.log(text);   // 同时打进 F12 控制台
        }

        ws.onopen = () => log("✅ 连接已建立");
        ws.onmessage = e => log("📩 收到: " + e.data);
        ws.onerror = e => log("❌ 连接出错（检查 IP、端口、防火墙）");
        ws.onclose = () => log("🔌 连接已关闭");

        function send() {
            const text = document.getElementById("msg").value;
            ws.send(text);
            log("📤 发送: " + text);
        }
    </script>
</body>
</html>
